<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" href="jason.png" type="image/x-icon">
<link rel="stylesheet" href="style.css">
<title>Agora eu posso falar que existe sim triângulo com 45° cada vertice, tanto interno quanto externo muhahahahh</title>

</head>
<body>
<canvas id="canvas"></canvas>

<div id="info">
    <b>Instruções</b><br>

    WASD → mover câmera<br>

    E → zoom<br>

    Q → deszoom<br>

    Scroll → zoom<br>

    Clique esquerdo → criar<br>

    Botão direito no vértice → inspecionar

</div>

<button id="limpar">
    Limpar
</button>

<div id="status">
    Nenhum polígono
</div>


<!--PAINEL DE CRIAÇÃO-->

<div id="criacao">
    <h2>Criação de forma</h2>
    <label>
        Forma
    </label>

    <div class="formaLinha">

        <select id="forma">

            <option value="3">
                Triângulo
            </option>

        <option value="4">
            Quadrado
        </option>

        <option value="5">
            Pentágono
        </option>

        <option value="6">
            Hexágono
        </option>

        <option value="7">
            Heptágono
        </option>

        <option value="8">
            Octógono
        </option>

        <option value="9">
            Eneágono
        </option>

        <option value="10">
            Decágono
        </option>

        <option value="12">
            Dodecágono
        </option>

        <option value="15">
            15 lados
        </option>

            <option value="20">
                20 lados
            </option>

            <option value="custom" id="formaCustomOption">
                Polígono personalizado
            </option>

        </select>

        <button
            type="button"
            id="abrirVertices"
            title="Definir quantidade de vértices">
            Nº
        </button>

    </div>

    <div id="painelVertices">

        <div class="painelVerticesTitulo">
            Quantidade de vértices
        </div>

        <input
            id="quantidadeVertices"
            type="number"
            min="1"
            step="1"
            placeholder="Ex.: 9 ou 981723">

        <div class="painelVerticesBotoes">
            <button
                type="button"
                class="botao pequeno"
                id="confirmarVertices">
                Usar quantidade
            </button>

            <button
                type="button"
                class="botao cancelar pequeno"
                id="cancelarVertices">
                Cancelar
            </button>
        </div>

    </div>

    <label>
        Ângulos dos vértices
    </label>

    <div id="listaAngulos"></div>

    <div id="aviso"></div>

    <button
        class="botao"
        id="criar">
        Criar polígono
    </button>


    <button
        class="botao cancelar"
        id="cancelar">
        Cancelar
    </button>

</div>


<!--INSPETOR-->

<div id="inspetor">

    <div id="inspetorCabecalho">

        <span id="tituloVertice">
            Vértice A
        </span>

        <button id="fechar">
            ×
        </button>

    </div>


    <label>
        Ângulo interno:
    </label>


    <input
        id="inputInterno"
        type="number"
        step="0.1"
    >


    <label>
        Ângulo externo:
    </label>


    <input
        id="inputExterno"
        type="number"
        step="0.1"
    >


    <div id="avisoVertice">
        ⚠ Os cálculos dos ângulos estão errados.
    </div>


    <div id="previewTitulo">

        Representação do ângulo

    </div>

    <canvas
        id="preview"
        width="300"
        height="150">
    </canvas>

</div>
    <div>
        <script src="script.js"></script>
    </div>
</body>

</html>
